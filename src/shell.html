<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pathloom</title>
<style>
  :root { --bg:#0f1420; --panel:#182033; --ink:#e8ecf5; --accent:#4f8cff; --gold:#ffd166; --muted:#93a0bd; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: "Segoe UI", system-ui, Arial, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:9px 14px;
    background:var(--panel); border-bottom:1px solid #26304a; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:.2px; white-space:nowrap; }
  header .hint { color:var(--muted); font-size:12px; margin-left:auto; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#212b44; color:var(--ink); border:1px solid #33405f;
    border-radius:6px; padding:6px 11px; font-size:13px; cursor:pointer; }
  button:hover { background:#2b3757; border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1220; font-weight:600; }
  button.primary:hover { background:#3f7dff; }

  body { display:flex; flex-direction:column; }
  #main { flex:1; min-height:0; display:flex; }
  #editor { width:360px; min-width:220px; display:flex; flex-direction:column;
    border-right:1px solid #26304a; background:#0c111b; }
  #editor.hidden { display:none; }
  #editor .cap { padding:7px 10px; font-size:11px; letter-spacing:.4px; text-transform:uppercase;
    color:var(--muted); border-bottom:1px solid #1c2436; }
  #src { flex:1; width:100%; resize:none; border:0; outline:none; padding:10px 12px;
    background:#0c111b; color:#d7e0f2; font-family:"Cascadia Code",Consolas,"Courier New",monospace;
    font-size:12.5px; line-height:1.5; tab-size:2; }
  #err { color:var(--err); font-size:12px; padding:8px 12px; border-top:1px solid #1c2436;
    white-space:pre-wrap; min-height:0; }
  #err:empty { display:none; }

  #stage { flex:1; min-width:0; position:relative; overflow:hidden; }
  #stage svg { width:100%; height:100%; display:block; }
  #status { padding:10px 16px; color:var(--muted); font-size:12px; border-top:1px solid #26304a; }

  /* trace interaction */
  #stage g.node { cursor:pointer; }
  #stage g.edgePaths path { cursor:pointer; }
  #stage g.edgeLabels g.edgeLabel { cursor:pointer; }
  #stage g.edgeLabels g.edgeLabel * { pointer-events:auto; }
  .dim { opacity:0.15; transition:opacity .15s ease; }
  g.node.hl-cur rect, g.node.hl-cur polygon, g.node.hl-cur circle, g.node.hl-cur path {
    stroke:var(--gold) !important; stroke-width:3px !important; }

  g.node.hl-next rect, g.node.hl-next polygon, g.node.hl-next circle, g.node.hl-next path {
    stroke:var(--accent) !important; stroke-width:3px !important; }

  path.hl-edge { stroke:var(--accent) !important; stroke-width:3.5px !important; }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible, #src:focus-visible, g.node:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  header { padding:14px 18px; gap:12px 24px; }
  header h1 { font-size:20px; letter-spacing:-.5px; }
  header .hint { flex-basis:100%; margin:0; line-height:1.5; }
  .toolbar-group { display:flex; gap:6px; padding-right:12px; border-right:1px solid #33405f; }
  .toolbar-group:last-child { border:0; padding:0; }
  #editor { width:clamp(280px, 30vw, 440px); }
  #editor .cap { padding:14px 16px; }
  #src { padding:16px; line-height:1.7; }
  #err { max-height:160px; overflow:auto; }
  @media (max-width:700px) {
    #main { flex-direction:column; }
    #editor { width:100%; height:38%; min-height:150px; border-right:0; border-bottom:1px solid #26304a; }
    #stage { min-height:180px; }
    header { padding:10px 12px; }
    .toolbar-group { flex-wrap:wrap; }
  }
  @media (prefers-reduced-motion:reduce) { .dim { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>Pathloom</h1>
  <div class="toolbar" role="toolbar" aria-label="Diagram controls">
    <div class="toolbar-group">
    <button id="render" class="primary">Render</button>
    <button id="toggle" aria-controls="editor" aria-expanded="true">Editor</button>
    <button id="export" title="Download a standalone interactive HTML viewer">Export HTML</button>
    </div>
    <div class="toolbar-group">
    <button id="back">&larr; Back</button>
    <button id="next">Next &rarr;</button>
    </div>
    <div class="toolbar-group">
    <button id="zin">Zoom in</button>
    <button id="zout">Zoom out</button>
    <button id="fit">Fit</button>
    <button id="onehundred">100%</button>
    <button id="reset">Reset trace</button>
    </div>
  </div>
  <span class="hint" id="hint">Offline diagram workspace &middot; Changes render automatically &middot; Select a step to follow its path</span>
</header>
<div id="main">
  <div id="editor">
    <label class="cap" for="src">Mermaid source · Saved on this device</label>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="err" role="alert"></div>
  </div>
  <div id="stage" role="region" aria-label="Diagram preview"></div>
</div>

<div id="status" role="status" aria-live="polite">Rendering&hellip;</div>
<!-- SCRIPTS -->
</body>
</html>
